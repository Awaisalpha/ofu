<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OFU · Every career opportunity in one place</title>
    <meta
      name="description"
      content="Verified jobs, internships, scholarships, freelance work and events for UCP students, in one place. A frontend redesign demo with student, alumni and admin views."
    />
    <meta name="theme-color" content="#2667ff" />
    <link rel="icon" type="image/svg+xml" href="/ofu-favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/ofu-apple-touch-icon.png?v=2" />

    <!-- Link previews. %VITE_SITE_URL% is the live address, filled in at build time (see vite.config.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OFU" />
    <meta property="og:title" content="OFU · Every career opportunity in one place" />
    <meta
      property="og:description"
      content="Verified jobs, internships, scholarships, freelance work and events for UCP students, in one place."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OFU: every career opportunity in one place, with opportunity cards and deadlines" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OFU · Every career opportunity in one place" />
    <meta
      name="twitter:description"
      content="Verified jobs, internships, scholarships, freelance work and events for UCP students, in one place."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <!-- text= downloads only the letters of the "Simple steps" label. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap&text=Simple%20steps"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
